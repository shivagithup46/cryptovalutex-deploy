management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: cryptovaultx
    export:
      prometheus:
        enabled: true # 1 day in milliseconds

